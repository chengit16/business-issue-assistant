services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - assistant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  assistant_postgres:
